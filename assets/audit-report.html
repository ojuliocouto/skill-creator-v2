<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Skill Audit Report</title>
<style>
  :root { --bg: #0d0d1a; --card: #1a1a2e; --border: #333; --text: #e0e0e0; --muted: #888; --green: #22c55e; --yellow: #eab308; --red: #ef4444; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: var(--bg); color: var(--text); max-width: 720px; margin: 40px auto; padding: 20px; }
  h1 { font-size: 28px; margin-bottom: 8px; }
  h2 { font-size: 13px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin: 24px 0 12px; }
  .score-hero { display: flex; align-items: center; gap: 16px; margin: 16px 0 24px; }
  .score-number { font-size: 56px; font-weight: 800; }
  .badge { display: inline-block; padding: 6px 16px; border-radius: 20px; font-weight: 700; font-size: 14px; }
  .pass { background: var(--green); color: #000; }
  .fail { background: var(--red); color: #fff; }
  .meta-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; font-size: 13px; color: var(--muted); }
  .criterion { border: 1px solid var(--border); border-radius: 10px; padding: 16px; margin: 10px 0; background: var(--card); transition: transform 0.15s; }
  .criterion:hover { transform: translateY(-2px); }
  .criterion-header { display: flex; justify-content: space-between; align-items: center; }
  .criterion-name { font-size: 16px; font-weight: 600; }
  .criterion-score { font-size: 28px; font-weight: 800; }
  .checks { margin-top: 10px; font-size: 13px; }
  .check { padding: 3px 0; }
  .check-pass { color: var(--green); }
  .check-fail { color: var(--red); }
  .footer { color: #444; font-size: 11px; margin-top: 32px; text-align: center; }
  .bar { height: 6px; border-radius: 3px; background: var(--border); margin-top: 8px; overflow: hidden; }
  .bar-fill { height: 100%; border-radius: 3px; transition: width 0.5s ease; }
</style>
</head>
<body>
  <h1 id="title">Skill Audit Report</h1>
  <div class="score-hero">
    <span class="score-number" id="total-score">--/60</span>
    <span class="badge" id="status-badge">--</span>
  </div>

  <h2>Summary</h2>
  <div class="meta-grid" id="summary-grid">
    <div>Loading...</div>
  </div>

  <h2>Criteria</h2>
  <div id="criteria-container">
    <!-- Populated by JS or by audit_skill.py -->
  </div>

  <p class="footer">Generated by skill-creator-v2 audit system</p>

  <script>
    // This template is populated by audit_skill.py's generate_html_report()
    // It can also be used standalone by passing JSON data via #data hash
    function renderAudit(data) {
      document.getElementById('title').textContent = `Skill Audit: ${data.skill}`;
      const totalEl = document.getElementById('total-score');
      totalEl.textContent = `${data.total_score}/60`;
      totalEl.style.color = data.passed ? 'var(--green)' : 'var(--red)';

      const badge = document.getElementById('status-badge');
      badge.textContent = data.passed ? 'PASSED' : 'FAILED';
      badge.className = `badge ${data.passed ? 'pass' : 'fail'}`;

      const s = data.summary;
      document.getElementById('summary-grid').innerHTML = `
        <div>Body: ${s.body_lines} lines</div>
        <div>Scripts: ${s.scripts_count}</div>
        <div>References: ${s.refs_count}</div>
        <div>Description: ${s.description_length} chars</div>
      `;

      const container = document.getElementById('criteria-container');
      container.innerHTML = '';
      data.criteria.forEach(c => {
        const color = c.score >= 8 ? 'var(--green)' : c.score >= 7 ? 'var(--yellow)' : 'var(--red)';
        const pct = (c.score / 10 * 100);
        const checksHtml = c.checks.map(ch => {
          const cls = ch.passed ? 'check-pass' : 'check-fail';
          const icon = ch.passed ? '&#10003;' : '&#10007;';
          return `<div class="check ${cls}">${icon} ${ch.check}</div>`;
        }).join('');

        container.innerHTML += `
          <div class="criterion">
            <div class="criterion-header">
              <span class="criterion-name">${c.criterion}</span>
              <span class="criterion-score" style="color:${color}">${c.score}/10</span>
            </div>
            <div class="bar"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div>
            <div class="checks">${checksHtml}</div>
          </div>`;
      });
    }

    // Auto-load from hash if present
    if (window.location.hash.startsWith('#data=')) {
      try {
        const data = JSON.parse(decodeURIComponent(window.location.hash.slice(6)));
        renderAudit(data);
      } catch(e) { console.error('Failed to parse audit data:', e); }
    }
  </script>
</body>
</html>
