name: ci

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ["3.10", "3.13"]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests (fake home with accent and space, cp1252 console)
        run: python -m unittest discover -s tests -v
      - name: README install, Windows PowerShell (exact commands from the README)
        if: runner.os == 'Windows' && github.event_name == 'push'
        shell: pwsh
        run: |
          git clone --branch "${{ github.ref_name }}" https://github.com/ojuliocouto/skill-creator-v2.git "$env:USERPROFILE\.claude\skills\skill-creator-v2"
          py -3 "$env:USERPROFILE\.claude\skills\skill-creator-v2\scripts\audit_skill.py" --skill-path "$env:USERPROFILE\.claude\skills\skill-creator-v2"
          if ($LASTEXITCODE -ne 0) { exit 1 }
          if (Test-Path -LiteralPath (Join-Path $PWD '~')) { Write-Error "clone created a literal ~ folder"; exit 1 }
      - name: Smoke test as Claude Code runs it (bash, installed under the real home)
        shell: bash
        run: |
          rm -rf ~/.claude/skills/skill-creator-v2
          PY=$(command -v python3 || command -v python)
          mkdir -p ~/.claude/skills
          cp -R . ~/.claude/skills/skill-creator-v2
          "$PY" ~/.claude/skills/skill-creator-v2/scripts/analyze_skills.py --summary
          "$PY" ~/.claude/skills/skill-creator-v2/scripts/scaffold.py --name smoke-teste --category workflow --description "Fluxo de publicação com análise e configuração" --triggers "publicar página"
          "$PY" ~/.claude/skills/skill-creator-v2/scripts/collision_check.py --description "Fluxo de publicação com análise" --triggers "publicar página"
          "$PY" ~/.claude/skills/skill-creator-v2/scripts/audit_skill.py --skill-path ~/.claude/skills/skill-creator-v2/ --html "$RUNNER_TEMP/relatório auditoria.html"
          test -s "$RUNNER_TEMP/relatório auditoria.html"
      - name: Diagnostics on failure
        if: failure()
        shell: bash
        run: |
          python --version; python -c "import sys,locale; print(sys.stdout.encoding, locale.getpreferredencoding())"
          for t in tests/test_*.py; do python -m unittest "$t" -v || true; done
